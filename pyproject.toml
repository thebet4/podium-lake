[project]
name = "podium-lake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius Barros", email = "barros.vinicius0103@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.125",
    "duckdb>=2.0.0",
    "fastf1>=3.9.2",
    "pandas>=2.3.3",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "pyspark>=4.3.0",
    "requests>=2.34.2",
]

[project.scripts]
podium-lake = "podium_lake.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
